[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dal-jax"
version = "0.1.0a1"
description = "Monte Carlo derivatives pricing with JAX, re-implementing DAL's simulation engine"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "jax>=0.11,<0.12",
    "numpy>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
cpu = ["jax[cpu]>=0.11,<0.12"]
cuda12 = ["jax[cuda12]>=0.11,<0.12"]
cuda13 = ["jax[cuda13]>=0.11,<0.12"]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "pytest>=8",
    "scipy>=1.14",
    "dal-python>=2026.9.25",
]
examples = [
    "dal-python>=2026.9.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dal_jax"]

[tool.hatch.build.targets.sdist]
include = ["src/dal_jax", "tests", "scripts", "examples", "benchmarks", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
markers = [
    "oracle: compares against dal-python (skipped when dal-python is not installed)",
    "slow: long-running statistical or benchmark-style tests",
    "gpu: optional validation on an actual GPU backend (requires --run-gpu)",
]
filterwarnings = [
    "ignore:An NVIDIA GPU may be present:UserWarning",
]

[tool.pylint.typecheck]
# Compiled extensions whose members astroid cannot introspect.
ignored-modules = ["dal", "scipy.special"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/dal_jax/dates/calendar_data.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E731"]
