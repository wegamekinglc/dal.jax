name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: CPU tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}  # sets UV_PYTHON and keys the cache per version
          cache-suffix: tests
      - name: Install
        run: uv sync
      - name: Test (4 virtual CPU devices, dal-python oracle included)
        run: uv run pytest

  examples:
    name: Example notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          cache-suffix: examples  # installs an extra group, so it must not share the tests cache
      - name: Install
        run: uv sync --group examples
      - name: Execute every notebook
        working-directory: examples
        run: |
          for notebook in *.ipynb; do
            uv run --group examples jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP" --ExecutePreprocessor.timeout=1200 "$notebook"
          done
