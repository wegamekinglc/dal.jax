name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Code quality (Codacy rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          cache-suffix: quality
      - name: Install
        run: uv sync
      - name: Check complexity across source, tests and examples
        run: uvx lizard -C 8 -w src tests scripts examples benchmarks
      - name: Check Python errors
        run: uv run --with pylint python -m pylint -E --disable=import-error src tests
      - name: Check security patterns
        run: |
          uvx bandit -q -r src scripts examples benchmarks
          uvx semgrep scan --config p/python --metrics off --error src scripts examples benchmarks

  test:
    name: CPU tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}  # sets UV_PYTHON and keys the cache per version
          cache-suffix: tests
      - name: Install
        run: uv sync
      - name: Test (4 virtual CPU devices, dal-python oracle included)
        run: uv run pytest

  examples:
    name: Python examples and DAL comparisons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          cache-suffix: examples
      - name: Install
        run: uv sync --group examples
      - name: Run published-oracle Python examples with DAL comparisons
        run: |
          for example in examples/0[1-8]_*.py; do
            uv run --group examples python "$example" --paths 4096 --devices 4 --repeat 1 --output "$RUNNER_TEMP/$(basename "$example" .py).json"
          done

  native-oracle:
    name: Pinned native DAL oracle and P5-P7 examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          cache-suffix: native-oracle
      - name: Install
        run: uv sync --group examples
      - name: Build pinned DAL source oracle
        run: bash scripts/build_dal_oracle.sh "$RUNNER_TEMP/dal-oracle" "$GITHUB_WORKSPACE/.venv/bin/python"
      - name: Full CPU suite with native oracle
        run: .venv/bin/python -m pytest
      - name: P5-P7 examples with DAL prices, risks and synchronized timings
        run: |
          for example in examples/09_*.py examples/1[0-6]_*.py; do
            .venv/bin/python "$example" --paths 4096 --devices 4 --repeat 1 --output "$RUNNER_TEMP/$(basename "$example" .py).json"
          done

  distribution:
    name: Alpha distribution and clean wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          cache-suffix: distribution
      - name: Build and validate wheel and source distribution
        run: |
          uv build
          uvx twine check dist/*
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Install only the built wheel and its runtime dependencies
        run: |
          uv venv "$RUNNER_TEMP/alpha-smoke"
          uv pip install --python "$RUNNER_TEMP/alpha-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/alpha-smoke/bin/python" scripts/smoke_install.py
      - name: Upload validated alpha distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dal-jax-distributions
          path: dist/
          if-no-files-found: error
